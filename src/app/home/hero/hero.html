<section id="hero" class="hero" aria-labelledby="hero-name">
  <div class="container">
    <h1 id="hero-name" class="hero-name">Sanjay Garg<span class="hero-dot" aria-hidden="true">.</span></h1>
    <p class="hero-role">Frontend Engineer</p>

    <p class="hero-bio">
      Currently at <strong>Aviva</strong>, building insurance platforms serving
      millions of customers in UK.
    </p>

    <div class="hero-actions">
      <a href="#experience" class="btn btn-primary">
        Explore my work
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M6 13l6 6 6-6" />
        </svg>
      </a>
      <a [href]="'mailto:' + email" class="btn btn-ghost">Contact by email</a>
    </div>
  </div>
</section>
