<footer id="contact" class="section contact" aria-labelledby="contact-heading">
  <div class="container section-inner">
    <h2 id="contact-heading" class="section-title">
      <span class="section-num" aria-hidden="true">03</span>
      Let's work together
    </h2>

    <p class="contact-sub">I'm open to new opportunities. Feel free to reach out.</p>

    <ul class="contact-links" role="list">
      <li>
        <a [href]="linkedInUrl" class="contact-link link-blue" target="_blank" rel="noopener noreferrer">
          LinkedIn
          <span class="visually-hidden">(opens in new tab)</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7M8 7h9v9" />
          </svg>
        </a>
      </li>
      <li>
        <a [href]="githubUrl" class="contact-link link-green" target="_blank" rel="noopener noreferrer">
          GitHub
          <span class="visually-hidden">(opens in new tab)</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7M8 7h9v9" />
          </svg>
        </a>
      </li>
    </ul>
  </div>
</footer>
