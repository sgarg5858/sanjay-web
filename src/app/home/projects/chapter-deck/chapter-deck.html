<div class="deck" [style.--accent]="accent()">
  <div class="deck-ghost deck-ghost-2" aria-hidden="true"></div>
  <div class="deck-ghost deck-ghost-1" aria-hidden="true"></div>

  @for (chapter of currentSlide(); track chapter.title) {
    <div
      class="slide"
      role="group"
      aria-roledescription="slide"
      [attr.aria-label]="'Chapter ' + (index() + 1) + ' of ' + total()"
      aria-live="polite"
    >
      <div class="slide-top">
        <span class="slide-kicker">Chapter</span>
        <span class="slide-count" aria-hidden="true">{{ pad(index() + 1) }} / {{ pad(total()) }}</span>
      </div>
      <span class="slide-num" aria-hidden="true">{{ pad(index() + 1) }}</span>
      <h4 class="slide-title">{{ chapter.title }}</h4>
      <p class="slide-teaser">{{ chapter.teaser }}</p>
    </div>
  }
</div>

<div class="deck-controls">
  <button type="button" class="deck-btn" (click)="prev()" aria-label="Previous chapter">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>

  <ol class="deck-dots">
    @for (chapter of chapters(); track chapter.title; let i = $index) {
      <li>
        <button
          type="button"
          class="deck-dot"
          [class.is-active]="i === index()"
          [attr.aria-current]="i === index() ? 'step' : null"
          [attr.aria-label]="'Chapter ' + (i + 1) + ': ' + chapter.title"
          (click)="go(i)"
        ></button>
      </li>
    }
  </ol>

  <button type="button" class="deck-btn" (click)="next()" aria-label="Next chapter">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18l6-6-6-6" />
    </svg>
  </button>
</div>
